name = "charger-watcher"
main = "src/worker.js"
compatibility_date = "2026-10-01"

[triggers]
crons = ["* * * * *"]

# Crea el namespace con: npx wrangler kv namespace create STATE
# y pega aquí el id que te devuelve
[[kv_namespaces]]
binding = "STATE"
id = "4417b251bd1341ad9f137b458a8dbfb2"

[vars]
CHARGER_NAME = "Cargador Cid 2 (Ibi)"
NOTIFY_WHEN_OCCUPIED = "false"
CHECK_INTERVAL_SECONDS = "45"
# Cargador E-A-Ibi-003 en REVE (Red Eléctrica): fuente principal; TomTom queda de respaldo
REVE_LOCATION_ID = "d3de90ea-32d3-457e-90a3-8bc423f645a2"
