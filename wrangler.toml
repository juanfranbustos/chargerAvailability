name = "charger-watcher"
main = "src/worker.js"
compatibility_date = "2026-10-01"

[triggers]
crons = ["* * * * *"]

# Crea el namespace con: npx wrangler kv namespace create STATE
# y pega aquí el id que te devuelve
[[kv_namespaces]]
binding = "STATE"
id = "4417b251bd1341ad9f137b458a8dbfb2"

[vars]
CHARGER_NAME = "Cargador Cid 2 (Ibi)"
NOTIFY_WHEN_OCCUPIED = "false"
CHECK_INTERVAL_SECONDS = "36"
# Enlace del botón "Cómo llegar" del aviso
CHARGER_MAPS_URL = "https://www.google.com/maps/dir/?api=1&destination=38.622057,-0.57403"
